name: CI

on:
  push:
    branches: [master]
    paths:
      - 'platform/web/**'
  pull_request:
    branches: [master]
    paths:
      - 'platform/web/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: platform/web/package-lock.json

      - run: npm ci

      - run: npm run build

      - run: npm run test
