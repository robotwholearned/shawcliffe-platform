<svg xmlns="http://www.w3.org/2000/svg" width="3.62in" height="2.12in" viewBox="0 0 3620 2120" role="img" aria-labelledby="title desc">
  <title id="title">Shawcliffe Digital Business Card - Back</title>
  <desc id="desc">Card back with hero statement and QR code linking to shawcliffedigital.com. 3.62 inch by 2.12 inch full bleed canvas.</desc>
