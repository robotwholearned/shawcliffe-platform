      .inter { font-family: Inter, Arial, Helvetica, sans-serif; }
      .bold { font-weight: 700; }
      .regular { font-weight: 400; }
    ]]></style>
    <clipPath id="trim-clip-back">
      <rect x="60" y="60" width="3500" height="2000"/>
    </clipPath>
  </defs>

