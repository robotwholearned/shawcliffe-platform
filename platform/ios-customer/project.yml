name: ShawcliffeCustomer
options:
  bundleIdPrefix: ca.shawcliffe
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0

targets:
  ShawcliffeCustomer:
    type: application
    platform: iOS
    sources:
      - path: ShawcliffeCustomer
    dependencies:
      - package: Supabase
        product: Supabase
    info:
      path: ShawcliffeCustomer/Info.plist
      properties:
        CFBundleDisplayName: ${CLIENT_APP_NAME}
        CLIENT_ID: ${CLIENT_ID}
        CLIENT_SLUG: ${CLIENT_SLUG}
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    entitlements:
      path: ShawcliffeCustomer/ShawcliffeCustomer.entitlements
      properties:
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${CLIENT_BUNDLE_ID}
        PRODUCT_NAME: ShawcliffeCustomer
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_TEAM: M5SD2YQ3QM
        CODE_SIGN_STYLE: Automatic
